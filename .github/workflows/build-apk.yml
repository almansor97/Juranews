name: Build JuraNews Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Prepare package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JuraNews.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JuraNews-Android
          path: JuraNews.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK for website download
        run: |
          mkdir -p downloads
          cp JuraNews.apk downloads/JuraNews.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/JuraNews.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest JuraNews APK"
            git push
          fi
