name: Archive previous JuraNews issue

on:
  push:
    paths:
      - "data/latest.json"
      - ".github/workflows/archive-latest.yml"

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive previous issue
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ ! -f data/archive/2026-W39.json ]; then
            git show 423d8a651ad50760c21884146c874bd5472a82e4:data/latest.json > data/archive/2026-W39.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/archive/2026-W39.json
            git commit -m "Archive 2026-W39 JuraNews issue"
            git pull --rebase origin main
            git push origin main
          fi
