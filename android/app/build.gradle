plugins {
    id 'com.android.application'
}

android {
    namespace 'de.juranews.app'
    compileSdk 35

    defaultConfig {
        applicationId "de.juranews.app"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
